# nginx site config for the Pi: receives the cameras' POSTs and forwards them to
# the Pi client (run_pi_client) on loopback.
#
# SAMPLE / REMINDER: merge these settings into the Pi's existing nginx config.
# Lines marked "CHANGE" depend on your setup.
#
#   ALPR camera --HTTP--> nginx (port 80) --HTTP--> run_pi_client on 127.0.0.1:3000
#
# THE ONE RULE: cameras cannot retry, so nginx must never refuse a camera post
# because of its content or rate. Everything below is about not losing an event.
# Whether an event is acceptable is decided by the Pi client, which stores it
# first and lets the collector judge it later.
#
# Install (Debian / Raspberry Pi OS paths):
#   sudo cp deploy/nginx-pi.conf /etc/nginx/sites-available/pi-collector
#   sudo ln -s /etc/nginx/sites-available/pi-collector /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check it (from another machine on the LAN, with a valid small event):
#   curl -i -X POST http://<pi-ip>/api/alpr/events -H 'Content-Type: application/json' \
#        --data-binary '{"camid":"CAM1","date":"2026-10-30T10:00:00+08:00","plate":"TEST0000","image":"/9j/4AAQ","plate_image":"/9j/4AAQ"}'
#   -> HTTP 200, and a new 'pending' row in the Pi's database.
#
# What NOT to add here (each would silently lose camera events):
#   * no token check: the cameras cannot send one (the collector's token is added
#     later by the Pi client, not by the cameras)
#   * no limit_req / limit_conn: a 429 or 503 to a camera is a lost event
#   * no small client_max_body_size: nginx's default is 1 MB, and events are bigger
#   * no redirect to HTTPS: cameras do not follow redirects, and this is the LAN

server {
    # CHANGE: any port the cameras can be pointed at. 80 needs no port in the camera
    # URL. Use another (for example 8080) if something else already uses port 80.
    # `default_server` makes requests by raw IP address match this block; remove it
    # if another site on the Pi already uses it on this port (nginx -t will complain).
    listen 80 default_server;
    listen [::]:80 default_server;

    # Cameras use the Pi's IP address, so any Host header is accepted.
    # CHANGE: a DNS name if the cameras use one.
    server_name _;

    # --- MUST be raised --------------------------------------------------------
    # One event is a JSON body holding two base64 images. It must be at least as
    # large as MAX_CAMERA_BODY_BYTES in `.env` (default 64 MB = 67108864), so that
    # the Pi client, not nginx, decides what is too big. An event over the
    # collector's 20 MB limit is still stored, and fails later with 413 from the
    # collector. If this value is smaller, nginx answers 413 first and the event is
    # lost, because the camera cannot retry.
    # CHANGE: keep in step with MAX_CAMERA_BODY_BYTES.
    client_max_body_size 64m;

    # Cameras are on the LAN, so slow uploads are unlikely. Still, do not let a
    # stalled connection stay open forever.
    client_body_timeout 60s;

    # Stream the body straight to the Pi client instead of first writing large
    # bodies to a temporary file on the SD card (fewer writes, less wear). The Pi
    # client reads the body into memory and commits it to SQLite before answering.
    proxy_request_buffering off;

    # The only route the Pi client serves.
    location = /api/alpr/events {
        # Only POST is meaningful (the Pi client answers other methods with 405).
        limit_except POST { deny all; }

        # CHANGE: must match PI_LISTEN_ADDR in `.env`. Use 127.0.0.1, not
        # "localhost", which can resolve to IPv6 while the Pi client listens on IPv4.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The Pi client replies as soon as the row is committed, which is quick.
        # These only matter if the Pi is under heavy load or the disk is slow.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Anything else: nothing here, so scanners and stray requests never reach the
    # Pi client.
    location / {
        return 404;
    }

    # CHANGE (optional): where nginx logs requests. The access log does not contain
    # request bodies.
    # access_log /var/log/nginx/pi.access.log;
    # error_log  /var/log/nginx/pi.error.log;
}

# If the Pi client is stopped or restarting, nginx answers 502 and the camera's
# event is lost. The systemd unit (deploy/mobile-vehicle-pi.service) restarts the
# client within seconds, so keep it running; watch `systemctl status
# mobile-vehicle-pi` and `journalctl -u mobile-vehicle-pi | grep -E 'ALERT|LOST'`.
