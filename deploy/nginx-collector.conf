# nginx site config for the data collector: shared-secret check + proxy.
#
# TESTING VERSION: plain HTTP on port 80 only (no domain name or TLS certificate
# yet). The token is sent in clear text, so use this only for testing, and
# switch back to the HTTPS config (see "MOVING TO HTTPS" below) before real use.
#
# DRAFT: review every line marked "CHANGE" before using it.
#
# What it does:
#   Raspberry Pi --HTTP--> nginx (checks the X-Collector-Token header)
#                            --HTTP--> collector on 127.0.0.1:3001
# A request without the correct token is refused by nginx (401) and never
# reaches the collector, so the Rust code needs no changes for this.
#
# Install (Debian/Ubuntu paths):
#   sudo cp deploy/nginx-collector.conf /etc/nginx/sites-available/collector
#   sudo ln -s /etc/nginx/sites-available/collector /etc/nginx/sites-enabled/
#   (create the secret file below, then)
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# THE SHARED SECRET
# ---------------------------------------------------------------------------
# nginx cannot read environment variables, and the secret must not be committed
# to git, so it lives in a separate file that this config `include`s.
#
# Create /etc/nginx/collector-token.conf (NOT in the repo) containing exactly:
#
#   map $http_x_collector_token $collector_token_ok {
#       default 0;
#       "PUT-THE-LONG-RANDOM-SECRET-HERE" 1;
#   }
#
# Generate a secret with:   openssl rand -hex 32
# Protect the file:         sudo chown root:root /etc/nginx/collector-token.conf
#                           sudo chmod 600 /etc/nginx/collector-token.conf
#
# `map` is only allowed at the http{} level. Files in sites-enabled/ are included
# inside http{}, so including it at the top of this file (as done below) works.
# To rotate the secret, add a second line for the new value while the Pis are
# being updated (both map to 1), then remove the old one:
#       "OLD-SECRET" 1;
#       "NEW-SECRET" 1;
#
# The Pi must send the header on every POST, e.g.:
#   curl -X POST http://YOUR-VPS-IP/api/alpr/event \
#        -H "X-Collector-Token: PUT-THE-LONG-RANDOM-SECRET-HERE" \
#        -H "Content-Type: application/json" -d @event.json
#
# WARNING: over plain HTTP the secret (and the images) travel unencrypted and
# can be read by anyone on the network path. Fine for testing with a throwaway
# secret; not acceptable for production.
#
# ---------------------------------------------------------------------------
# MOVING TO HTTPS (once you have a domain and certificate)
# ---------------------------------------------------------------------------
# 1. Point a DNS name at this server and get a certificate:
#      sudo certbot certonly --nginx -d collector.example.com
# 2. Change the port-80 server block below to only redirect:
#      server_name collector.example.com;
#      location /.well-known/acme-challenge/ { root /var/www/html; }
#      location / { return 301 https://$host$request_uri; }
# 3. Add a second server block with these lines, and move everything from
#    `client_max_body_size` down (the locations) into it:
#      listen 443 ssl;
#      listen [::]:443 ssl;
#      server_name collector.example.com;
#      ssl_certificate     /etc/letsencrypt/live/collector.example.com/fullchain.pem;
#      ssl_certificate_key /etc/letsencrypt/live/collector.example.com/privkey.pem;
#      ssl_protocols TLSv1.2 TLSv1.3;
#    (The full HTTPS version is in git history of this file.)
# 4. Generate a NEW secret: the one used over HTTP should be treated as exposed.
# ---------------------------------------------------------------------------

include /etc/nginx/collector-token.conf;

# Limit how often one client address may POST, so a stuck or hostile client
# cannot flood the collector. 10 requests/second per IP, burst of 20 below.
# CHANGE: raise it if the Pi legitimately sends events faster than this.
# Note: after a network outage the Pi will flush its backlog of queued events
# (see README_PI.md). Excess requests get 429, which the Pi is told to treat as
# "retry later", so a low limit only slows the catch-up, it does not lose data.
# Several Pis behind one NAT share a single address, so they share this limit.
limit_req_zone $binary_remote_addr zone=collector_limit:10m rate=10r/s;

# --- Port 80: the real server (testing, no TLS) ----------------------------
server {
    # default_server so requests by raw IP address (no domain yet) match this
    # block. If another site in sites-enabled already uses default_server on
    # port 80, remove that keyword here or there (nginx -t will complain).
    listen 80 default_server;
    listen [::]:80 default_server;

    # No domain yet: `_` matches any Host header.
    # CHANGE: your server's DNS name once you have one.
    server_name _;

    # Each event is one JSON body holding two base64 images. This MUST be at
    # least as large as MAX_BODY_BYTES in src/collector_server.rs (currently
    # 20 MB). If nginx's value is smaller, nginx answers 413 first.
    client_max_body_size 20m;

    # Slow uploads over a mobile/remote link: allow time to send the body, but
    # do not let a client hold a connection open forever.
    client_body_timeout 60s;

    # The only route the collector serves. Everything else is a 404 from nginx,
    # so scanners never reach the Rust app.
    location = /api/alpr/event {
        # Only POST is meaningful here (the collector answers GET with 405).
        limit_except POST { deny all; }

        # --- the shared-secret check ---
        # 401 if the header is missing or wrong. (Constant-time comparison is
        # not needed here: `map` does an exact hash lookup, not a byte loop.)
        if ($collector_token_ok = 0) {
            return 401 "Unauthorized\n";
        }

        limit_req zone=collector_limit burst=20 nodelay;

        # CHANGE: must match COLLECTOR_ADDR in the collector's `.env`.
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not pass the secret on to the collector (it does not need it, and
        # this keeps it out of any request logging added there later).
        proxy_set_header X-Collector-Token "";

        # Writing two images to disk and one DB row is quick, but give it room.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Anything else: nothing here.
    location / {
        return 404;
    }

    # CHANGE (optional): where nginx logs requests. Note the access log does not
    # contain the request body or the token header.
    # access_log /var/log/nginx/collector.access.log;
    # error_log  /var/log/nginx/collector.error.log;
}
